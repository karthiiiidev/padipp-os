<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0a1526" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Border Card -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="rgba(10, 10, 10, 0.65)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

  <!-- Badge / Pill -->
  <g transform="translate(90, 95)">
    <rect width="360" height="38" rx="19" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <circle cx="20" cy="19" r="5" fill="#38bdf8"/>
    <text x="36" y="24" fill="#38bdf8" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="1">STUDENT ACADEMIC OPERATING SYSTEM</text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(90, 220)">
    <text font-family="'Space Grotesk', -apple-system, sans-serif" font-size="78" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">PADIPP<tspan fill="#38bdf8">.OS</tspan></text>
  </g>

  <!-- Tagline / Headline -->
  <g transform="translate(90, 280)">
    <text font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Your Academic Operating System</text>
    <text y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="3">BUILT FOR ENGINEERS. BY AN ENGINEER.</text>
    <text y="78" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500" fill="#38bdf8" letter-spacing="2">Track. Plan. Predict.</text>
  </g>

  <!-- Capabilities Pill Row -->
  <g transform="translate(90, 425)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="24" y="26" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600">Attendance Tracker</text>

    <!-- Pill 2 -->
    <rect x="235" y="0" width="210" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="255" y="26" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600">IA &amp; Grade Predictor</text>

    <!-- Pill 3 -->
    <rect x="460" y="0" width="190" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="480" y="26" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600">Timetable &amp; Today</text>

    <!-- Pill 4 -->
    <rect x="665" y="0" width="190" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="685" y="26" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600">Exam Countdown</text>

    <!-- Pill 5 -->
    <rect x="870" y="0" width="150" height="42" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <text x="890" y="26" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600">Offline-First</text>
  </g>

  <!-- Footer Tagline / Geo Origin -->
  <g transform="translate(90, 520)">
    <circle cx="6" cy="-5" r="4" fill="#38bdf8"/>
    <text x="20" y="0" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500">From Trivandrum, Kerala</text>
    <text x="750" y="0" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="15">Built by KarthiiiDev</text>
  </g>
</svg>
