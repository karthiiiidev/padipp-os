<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@800;900&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;family=JetBrains+Mono:wght@600&amp;display=swap');
      .bg { fill: #000000; }
      .grid-pattern { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
      .brand-title { font-family: 'Barlow Semi Condensed', 'Space Grotesk', system-ui, sans-serif; font-size: 112px; font-weight: 900; fill: #ffffff; letter-spacing: -2px; }
      .brand-accent { fill: #38bdf8; }
      .subtitle { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 34px; font-weight: 700; fill: #f1f5f9; letter-spacing: -0.5px; }
      .statement { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 18px; font-weight: 600; fill: #94a3b8; letter-spacing: 5px; text-transform: uppercase; }
      .action-tag { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; fill: #38bdf8; letter-spacing: 3px; }
      .origin { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #64748b; letter-spacing: 2px; text-transform: uppercase; }
      .badge-bg { fill: rgba(255, 255, 255, 0.05); stroke: rgba(255, 255, 255, 0.1); stroke-width: 1; }
      .author { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #475569; letter-spacing: 1px; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid-pattern"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" class="bg"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Top Pill Badge -->
  <rect x="90" y="80" width="310" height="38" rx="19" class="badge-bg"/>
  <circle cx="112" cy="99" r="4" fill="#38bdf8"/>
  <text x="126" y="104" class="origin">From Trivandrum, Kerala</text>

  <!-- Brand Wordmark -->
  <text x="90" y="235" class="brand-title">PADIPP<tspan class="brand-accent">.OS</tspan></text>

  <!-- Main Product Tagline -->
  <text x="94" y="300" class="subtitle">Your Academic Operating System</text>

  <!-- Supporting Statement -->
  <text x="94" y="354" class="statement">Built for Engineers. By an Engineer.</text>

  <!-- Action Statement -->
  <text x="94" y="415" class="action-tag">Track. Plan. Predict.</text>

  <!-- Divider Line -->
  <line x1="90" y1="475" x2="1110" y2="475" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Footer Metadata in Image -->
  <text x="90" y="535" class="author">karthiiiidev.vercel.app</text>
  <text x="1110" y="535" text-anchor="end" class="author">Client-Side • Offline-First • Zero Telemetry</text>
</svg>
