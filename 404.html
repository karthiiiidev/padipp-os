<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

  <title>404 — Page Not Found | PADIPP.OS</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
  <link rel="stylesheet" href="./css/main.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #000000;
      color: #f5f5f7;
      text-align: center;
      padding: 24px;
    }
    .error-card {
      max-width: 480px;
      padding: 40px 32px;
      background: #0a0a0a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }
    .error-code {
      font-family: var(--font-mono, monospace);
      font-size: 4rem;
      font-weight: 800;
      color: var(--accent, #38bdf8);
      line-height: 1;
      margin-bottom: 16px;
    }
    .error-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .error-desc {
      color: var(--text-secondary, #98a1b2);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .brand-tag {
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--text-muted, #5c6577);
      font-family: var(--font-mono, monospace);
    }
  </style>

  <!-- Vercel Web Analytics -->
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>

<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Lost your way?</h1>
    <p class="error-desc">
      The academic page or resource you are looking for does not exist or has been relocated. PADIPP.OS can help you get back on track.
    </p>
    <a href="./" class="btn btn-primary btn-lg" style="width: 100%; justify-content: center;">
      Back to PADIPP.OS →
    </a>
    <div class="brand-tag">
      PADIPP.OS • Your Academic Operating System
    </div>
  </div>
</body>
</html>
